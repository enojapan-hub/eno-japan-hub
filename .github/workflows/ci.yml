name: ENO JAPAN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Generate TanStack routes
        run: npx @tanstack/router-cli@1.170.18 generate

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit
